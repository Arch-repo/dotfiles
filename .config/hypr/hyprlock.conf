source = ~/.config/hypr/conf/theme.generated.conf

background {
    path = $anto426_wallpaper
    color = $anto426_background
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME LABEL (Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $anto426_foreground_strong
    font_size = 94
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# DATE LABEL (Subtitle)
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +'%A, %d %B')"
    color = $anto426_accent_strong
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 75
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25      # Scale of input-field height, 0.2 - 0.8
    dots_space = 0.35     # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1    # -1 default circle, -2 square
    
    outer_color = $anto426_border_soft
    inner_color = $anto426_surface_soft
    font_color = $anto426_foreground
    
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="$anto426_muted_hex">Inserisci password...</span>
    hide_input = false
    rounding = 25  # Perfect modern pill card
    
    check_color = $anto426_accent_soft
    fail_color = rgba(243, 139, 168, 0.8)        # Theme red #f38ba8 on failure
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    
    position = 0, -50
    halign = center
    valign = center
}
