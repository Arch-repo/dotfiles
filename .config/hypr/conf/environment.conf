#------------------------------------------------------------------------------------------------



env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
# Let qt5ct/qt6ct load Kvantum and preserve the complete application palette.
env = QT_STYLE_OVERRIDE,
env = QT_QUICK_CONTROLS_CONF,$HOME/.config/anto426-local/theme/qtquickcontrols2.conf
env = QML_IMPORT_PATH,$HOME/.local/share/anto-desktop/qml
env = QML2_IMPORT_PATH,$HOME/.local/share/anto-desktop/qml
# Qt5 lookup; Qt6 uses the QML import path above.
env = QT_QUICK_CONTROLS_STYLE_PATH,$HOME/.local/share/anto-desktop/qml
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland

env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx

xwayland {
  force_zero_scaling = true
}

ecosystem {
  no_update_news = true
}
