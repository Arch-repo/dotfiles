#----------------------------------------



input {
    kb_layout = it,us
    kb_variant = 
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat

    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
        tap-to-click = true
        disable_while_typing = true
    }
}

# 3-finger swipe gestures matching Super + [slot] per-monitor behavior
gesture = 3, left, dispatcher, exec, ~/.local/bin/anto-menu workspace-output next
gesture = 3, right, dispatcher, exec, ~/.local/bin/anto-menu workspace-output previous

device {
    name = epic-mouse-v1
    sensitivity = 0
}
