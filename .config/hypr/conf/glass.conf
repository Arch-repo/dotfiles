# GPU compositor sampling for shell layers, terminals and desktop widgets.
# Dependency revision and local adaptation are pinned in resources.lock.json.
# The installer writes the absolute library path to the machine-local loader.
plugin:hyprglass {
    enabled = 0
    manage_window_blur = 1
    default_preset = anto-desktop
    default_theme = dark
    self_sample = 0
    preset = name:anto-desktop, inherits:clear, blur_strength:0.65, blur_iterations:2, refraction_strength:0.55, chromatic_aberration:0.08, fresnel_strength:0.25, specular_strength:0.24, lens_distortion:0.12, edge_thickness:0.035, glass_opacity:0.95
    preset = name:anto-desktop:dark, brightness:0.9, contrast:1.0, adaptive_dim:0.4, tint_color:0x080c1224
    preset = name:anto-compact, inherits:anto-desktop, refraction_strength:0.3, lens_distortion:0.04, edge_thickness:0.08, chromatic_aberration:0.04
    windows {
        background_cache = 1
        live_resample = 1
        # Follow damaged compositor frames; keep cached backgrounds when idle.
        live_resample_fps = 0
    }
    layers {
        enabled = 1
        namespaces = anto426-menu, anto426-wallpaper, anto426-osd, anto426-widget, waybar, swaync-control-center, swaync-notification-window, logout_dialog
        preset = anto-desktop
        mask_mode = auto
        namespace_mask_modes = anto426-menu=region, anto426-wallpaper=region, anto426-osd=region, anto426-widget=region
        namespace_presets = waybar:anto-compact, swaync-notification-window:anto-compact, anto426-osd:anto-compact
        namespace_mask_thresholds = waybar=0.1, swaync-control-center=0.1, swaync-notification-window=0.1
        manage_blur = 1
        live_resample = 1
        # A fixed 60 Hz sampler visibly lags 120 Hz window/workspace motion.
        live_resample_fps = 0
        force_live_resample = 0
    }
}

# Fullscreen transparent hosts keep their panel coordinates while fading.
layerrule = animation fade, match:namespace ^anto426-(menu|wallpaper)$
layerrule = animation fade, match:namespace ^anto426-wallpaper-preview$

# Terminal-backed desktop widgets are shell surfaces with their own class.
windowrule = tag +hyprglass_enabled, match:class ^anto426[.]widget[.]
windowrule = tag +hyprglass_preset_anto-desktop, match:class ^anto426[.]widget[.]

# Terminal windows sample the real scene behind them with the same material.
windowrule = tag +hyprglass_enabled, match:class ^(ghostty|com[.]mitchellh[.]ghostty)$
windowrule = tag +hyprglass_preset_anto-desktop, match:class ^(ghostty|com[.]mitchellh[.]ghostty)$

# Desktop cards keep keyboard focus in applications.
layerrule = animation fade, match:namespace ^anto426-widget$
