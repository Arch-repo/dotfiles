#-----------------------------------------------------------------------------------

source = ~/.config/anto426-local/hypr/theme.generated.conf


general {
    gaps_in = 3
    gaps_out = 7

    border_size = 0

    col.active_border = $anto426_active_border
    col.inactive_border = $anto426_inactive_border

    resize_on_border = true
    extend_border_grab_area = 10

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2

    active_opacity = 1.0
    # Toolkit themes own background alpha; focus must not fade their content.
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000038)
        color_inactive = rgba(00000018)
    }

    blur {
        enabled = yes
        size = 10
        passes = 4
        new_optimizations = on
        ignore_opacity = on
        popups = true
        popups_ignorealpha = 0.6
        input_methods = false
    }
}

# Blur Waybar frosted glass capsules (ignores transparent gaps between capsules)
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.25, match:namespace waybar

# Blur wlogout
layerrule = blur on, match:namespace logout_dialog
layerrule = dim_around false, match:namespace logout_dialog
# Blur swaync
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.99, match:namespace swaync-notification-window
layerrule = dim_around false, match:namespace swaync-control-center
layerrule = dim_around false, match:namespace swaync-notification-window

# Native C menu surface.
layerrule = blur on, match:namespace anto426-menu
layerrule = ignore_alpha 0.16, match:namespace anto426-menu
layerrule = dim_around false, match:namespace anto426-menu

# Blur OSD component like the shell.
layerrule = blur on, match:namespace anto426-osd
layerrule = ignore_alpha 0.1, match:namespace anto426-osd
layerrule = dim_around false, match:namespace anto426-osd

# Transparent gallery host: blur only the visible glass panel.
layerrule = blur on, match:namespace anto426-wallpaper
layerrule = ignore_alpha 0.18, match:namespace anto426-wallpaper
layerrule = dim_around false, match:namespace anto426-wallpaper
