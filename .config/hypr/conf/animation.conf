# Shared motion: progressive acceleration, smooth settling and no overshoot.
# Hyprland duration units are 100 ms; opacity follows the geometric transition.

animations {
    enabled = yes

    bezier = motion_out, 0.22, 0.35, 0.30, 1.0
    bezier = motion_quick, 0.22, 0.45, 0.30, 1.0
    bezier = motion_spaces, 0.28, 0.0, 0.24, 1.0

    # Bound inherited animations too, rather than leaving the 800 ms default.
    animation = global, 1, 3.0, motion_out
    animation = windows, 1, 3.0, motion_out, popin 96%
    animation = windowsIn, 1, 3.0, motion_out, popin 96%
    animation = windowsOut, 1, 2.0, motion_quick, popin 98%
    animation = windowsMove, 1, 3.2, motion_out

    animation = border, 0
    animation = borderangle, 0

    animation = fade, 1, 2.0, motion_quick
    animation = fadeIn, 1, 2.2, motion_out
    animation = fadeOut, 1, 1.8, motion_quick
    animation = fadeSwitch, 1, 1.8, motion_quick
    animation = fadeShadow, 1, 2.2, motion_out
    animation = fadeDim, 1, 2.2, motion_out
    animation = fadePopups, 1, 1.8, motion_quick

    # Fullscreen menu/gallery hosts override slide with fade in glass.conf.
    animation = layers, 1, 2.8, motion_out, slide
    animation = layersIn, 1, 2.8, motion_out, slide
    animation = layersOut, 1, 2.0, motion_quick, slide
    animation = fadeLayers, 1, 2.2, motion_out
    animation = fadeLayersIn, 1, 2.8, motion_out
    animation = fadeLayersOut, 1, 2.0, motion_quick

    # A small translation preserves direction without moving a whole screen.
    animation = workspaces, 1, 3.6, motion_spaces, slidefade 14%
    animation = specialWorkspace, 1, 3.2, motion_spaces, slidefadevert 16%
}
