#------------------------------------------------------------------------------

# Export the Wayland session before starting user services that need it.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = systemctl --user reset-failed swaync.service waybar.service
exec-once = systemctl --user restart swaync.service
exec-once = systemctl --user restart waybar.service
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user restart anto426-notifications.service
exec-once = systemctl --user restart anto426-calendar-sync.service
exec-once = awww-daemon
exec-once = ~/.config/anto426/wallpaper_apply.sh --restore
exec-once = ~/.config/anto426/wallpaper_daemon.sh
# Keep monitor-local workspace groups in sync on hotplug without rewriting the
# versioned dotfiles. The launcher imports this compositor's environment before
# asking the persistent systemd user unit to start.
exec-once = ~/.config/anto426/workspace_output_watch_start.sh
# Restore only explicitly persistent headless outputs.
exec-once = ~/.local/bin/anto-menu virtual-output restore
exec-once = systemctl --user restart anto426-bluetooth-audio.service
exec-once = nm-applet --indicator
exec-once = kdeconnect-indicator &

# Setup fcitx5
exec-once = fcitx5 -d

# Clipboard history backend for the native C menu.
exec-once = systemctl --user restart anto426-clipboard-text.service
exec-once = systemctl --user restart anto426-clipboard-image.service

# Setup themes
exec-once = ~/.config/anto426/gtkthemes.sh

# Native GTK widgets: one shared process, enabled cards on each monitor.
# Both the master switch and the saved autostart preference must be enabled.
exec-once = ~/.config/anto426/widgets.sh autostart
