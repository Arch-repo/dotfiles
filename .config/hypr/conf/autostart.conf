# Export the Wayland session before starting user services that need it.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = systemctl --user reset-failed swaync.service
exec-once = systemctl --user restart swaync.service
exec-once = waybar
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.config/anto426/notification_log.sh
exec-once = ~/.config/anto426/remote_sync.sh daemon
exec-once = awww-daemon
exec-once = ~/.config/anto426/wallpaper_apply.sh --restore
exec-once = ~/.config/anto426/wallpaper_daemon.sh
exec-once = nm-applet --indicator

# Setup fcitx5
exec-once = fcitx5 -d

# Setup clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Setup themes
exec-once = ~/.config/anto426/gtkthemes.sh

# Optional desktop widgets; edit ~/.config/anto426/widgets.env to disable them.
exec-once = ~/.config/anto426/widgets.sh autostart
