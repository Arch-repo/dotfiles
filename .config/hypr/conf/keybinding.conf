#-----------------------------------------------------------------------------



$mainMod = SUPER
$screenshotMenu = ~/.config/anto426/screenshot_menu.sh
$floatingMenu = ~/.config/anto426/floating_manager.sh

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}

bind = $mainMod, H, exec, ~/.config/anto426/key_hints.sh # Show keybinding hints

bind = $mainMod, Space, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, N, exec, ~/.config/anto426/notes_launcher.sh
bind = , XF86Assistant, exec, ~/.config/anto426/notes_launcher.sh
bind = , F23, exec, ~/.config/anto426/notes_launcher.sh
bind = $mainMod Shift, N, exec, ~/.config/anto426/identify_copilot_key.sh

bind = $mainMod Shift Control, Escape, exit,
bind = $mainMod, Q, killactive,
bind = $mainMod Shift, Q, exec, hyprctl activewindow -j | jq -er '.pid' | xargs -r kill

bind = $mainMod, F, exec, $floatingMenu toggle
bind = $mainMod Shift, F, exec, $floatingMenu menu
bind = $mainMod Control, F, exec, $floatingMenu center
bind = $mainMod Alt, F, exec, $floatingMenu pin
bind = $mainMod Control, 1, exec, $floatingMenu small
bind = $mainMod Control, 2, exec, $floatingMenu medium
bind = $mainMod Control, 3, exec, $floatingMenu large
bind = $mainMod Control, T, exec, $floatingMenu top
bind = $mainMod Control, BackSpace, exec, $floatingMenu reset
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, S, fullscreen, 0

bind = $mainMod, L, exec, hyprlock
bind = Alt, Space, exec, ~/.config/anto426/app_launcher.sh # Application launcher
bind = $mainMod, PERIOD, exec, ~/.config/anto426/emoji_launcher.sh # Select emoji
bind = $mainMod, V, exec, ~/.config/anto426/clipboard_launcher.sh # Open clipboard
bind = $mainMod, W, exec, ~/.config/anto426/wallpaper_select.sh # Select wallpaper
bind = $mainMod Shift, W, exec, ~/.config/anto426/wallpaper_random.sh # Random wallpaper
bind = $mainMod, G, exec, ~/.config/anto426/widgets.sh toggle # Toggle desktop widgets
bind = $mainMod Shift, G, exec, ~/.config/anto426/widgets.sh restart # Restart desktop widgets
bind = $mainMod Alt, G, exec, ~/.config/anto426/widgets.sh save-layout # Save widget positions
bind = $mainMod Shift Alt, G, exec, ~/.config/anto426/widgets.sh arrange # Widget layout menu
bind = $mainMod Shift, B, exec, ~/.config/anto426/brightness_menu.sh # Brightness menu
bind = $mainMod Shift, P, exec, ~/.config/anto426/projection_menu.sh # Display projection menu
bind = $mainMod Shift, S, exec, $screenshotMenu # Screenshot
bind = $mainMod Shift, R, exec, $screenshotMenu record-menu # Screen recorder
bind = , Print, exec, $screenshotMenu quick-area
bind = Shift, Print, exec, $screenshotMenu quick-window
bind = Alt, Print, exec, $screenshotMenu
bind = Control, Print, exec, $screenshotMenu quick-monitor
bind = $mainMod, Print, exec, ~/.config/anto426/screenshot_menu.sh quick-monitor
bind = , F9, exec, $screenshotMenu record-menu
bind = , F11, exec, $screenshotMenu screenshot-menu

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod Shift, Tab, workspace, e-1

# Move active window with mainMod + Shift + arrow keys
bind = $mainMod Shift, left, exec, $floatingMenu move-left
bind = $mainMod Shift, right, exec, $floatingMenu move-right
bind = $mainMod Shift, up, exec, $floatingMenu move-up
bind = $mainMod Shift, down, exec, $floatingMenu move-down

# Resize active window with mainMod + Control + arrow keys
bind = $mainMod Control, left, exec, $floatingMenu resize-left
bind = $mainMod Control, right, exec, $floatingMenu resize-right
bind = $mainMod Control, up, exec, $floatingMenu resize-up
bind = $mainMod Control, down, exec, $floatingMenu resize-down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/anto426/audio_feedback.sh volume-up
bindel = ,XF86AudioLowerVolume, exec, ~/.config/anto426/audio_feedback.sh volume-down
bindel = ,XF86AudioMute, exec, ~/.config/anto426/audio_feedback.sh mute
bindel = ,XF86AudioMicMute, exec, ~/.config/anto426/audio_feedback.sh mic-mute
bindel = ,XF86MonBrightnessUp, exec, ~/.config/anto426/brightness_menu.sh up
bindel = ,XF86MonBrightnessDown, exec, ~/.config/anto426/brightness_menu.sh down
bindl = , XF86PowerOff, exec, ~/.config/anto426/control_menu.sh power

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
