#-----------------------------------------------------------------------------



$mainMod = SUPER
$nativeMenu = ~/.local/bin/anto-menu
$workspaceTriad = ~/.local/libexec/anto426/workspace-triad

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}

bind = $mainMod, H, exec, $nativeMenu shortcuts # Show keybinding hints

bind = $mainMod, Space, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, N, exec, ~/.config/anto426/notes_launcher.sh

bind = $mainMod Shift Control, Escape, exit,
bind = $mainMod, Q, killactive,
bind = $mainMod Shift, Q, exec, hyprctl activewindow -j | jq -er '.pid' | xargs -r kill

bind = $mainMod, F, exec, $nativeMenu floating-toggle
bind = $mainMod Shift, F, exec, $nativeMenu floating
bind = $mainMod Control, F, exec, $nativeMenu floating-center
bind = $mainMod Alt, F, exec, $nativeMenu floating-pin
bind = $mainMod Control, 1, exec, $nativeMenu floating-small
bind = $mainMod Control, 2, exec, $nativeMenu floating-medium
bind = $mainMod Control, 3, exec, $nativeMenu floating-large
bind = $mainMod Control, T, exec, $nativeMenu floating-top
bind = $mainMod Control, BackSpace, exec, $nativeMenu floating-reset
bind = $mainMod, P, exec, $nativeMenu settings
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, S, fullscreen, 0

bind = $mainMod, L, exec, hyprlock
bind = Alt, Space, exec, $nativeMenu apps # Application launcher
bind = $mainMod, PERIOD, exec, $nativeMenu emoji # Select emoji
bind = $mainMod, V, exec, $nativeMenu clipboard # Open clipboard
bind = $mainMod, W, exec, ~/.config/anto426/wallpaper_select.sh # Select wallpaper
bind = $mainMod Shift, W, exec, ~/.config/anto426/wallpaper_random.sh # Random wallpaper
# Widget nativi: visibilità, catalogo e disposizione per monitor.
bind = $mainMod, G, exec, ~/.config/anto426/widgets.sh toggle
bind = $mainMod Shift, G, exec, ~/.config/anto426/widgets.sh restart
bind = $mainMod Control, G, exec, $nativeMenu widgets
bind = $mainMod Alt, G, exec, ~/.config/anto426/widgets.sh save-layout
bind = $mainMod Shift Alt, G, exec, $nativeMenu widgets
bind = $mainMod Shift, B, exec, $nativeMenu brightness # Brightness menu
bind = $mainMod Shift, P, exec, $nativeMenu display # Display projection menu
bind = $mainMod Shift, S, exec, $nativeMenu capture # Screenshot
bind = $mainMod Shift, R, exec, $nativeMenu record # Screen recorder
bind = , Print, exec, $nativeMenu capture-area-now
bind = Shift, Print, exec, $nativeMenu capture-window-now
bind = Alt, Print, exec, $nativeMenu capture
bind = Control, Print, exec, $nativeMenu capture-monitor-now
bind = $mainMod, Print, exec, $nativeMenu capture-monitor-now
bind = , F9, exec, $nativeMenu record
bind = , F11, exec, $nativeMenu capture

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, Tab, exec, $workspaceTriad cycle next
bind = $mainMod Shift, Tab, exec, $workspaceTriad cycle previous

# Move active window with mainMod + Shift + arrow keys
bind = $mainMod Shift, left, exec, $nativeMenu floating-move-left
bind = $mainMod Shift, right, exec, $nativeMenu floating-move-right
bind = $mainMod Shift, up, exec, $nativeMenu floating-move-up
bind = $mainMod Shift, down, exec, $nativeMenu floating-move-down

# Resize active window with mainMod + Control + arrow keys
bind = $mainMod Control, left, exec, $nativeMenu floating-resize-left
bind = $mainMod Control, right, exec, $nativeMenu floating-resize-right
bind = $mainMod Control, up, exec, $nativeMenu floating-resize-up
bind = $mainMod Control, down, exec, $nativeMenu floating-resize-down

# Workspace locali al monitor sotto focus.
# Ogni monitor mostra inizialmente 1…5. Super+1…9 e Super+0 (= 10) possono
# creare al volo altri workspace nello stesso gruppo del monitor sotto focus.
# Gli identificatori reali sono distinti (HDMI·1, eDP·1, DP·1, …).
bind = $mainMod, 0, exec, $nativeMenu workspace-output select 10
bind = $mainMod, 1, exec, $nativeMenu workspace-output select 1
bind = $mainMod, 2, exec, $nativeMenu workspace-output select 2
bind = $mainMod, 3, exec, $nativeMenu workspace-output select 3
bind = $mainMod, 4, exec, $nativeMenu workspace-output select 4
bind = $mainMod, 5, exec, $nativeMenu workspace-output select 5
bind = $mainMod, 6, exec, $nativeMenu workspace-output select 6
bind = $mainMod, 7, exec, $nativeMenu workspace-output select 7
bind = $mainMod, 8, exec, $nativeMenu workspace-output select 8
bind = $mainMod, 9, exec, $nativeMenu workspace-output select 9

# Sposta la finestra nel gruppo del monitor corrente.
bind = $mainMod SHIFT, 0, exec, $nativeMenu workspace-output move 10
bind = $mainMod SHIFT, 1, exec, $nativeMenu workspace-output move 1
bind = $mainMod SHIFT, 2, exec, $nativeMenu workspace-output move 2
bind = $mainMod SHIFT, 3, exec, $nativeMenu workspace-output move 3
bind = $mainMod SHIFT, 4, exec, $nativeMenu workspace-output move 4
bind = $mainMod SHIFT, 5, exec, $nativeMenu workspace-output move 5
bind = $mainMod SHIFT, 6, exec, $nativeMenu workspace-output move 6
bind = $mainMod SHIFT, 7, exec, $nativeMenu workspace-output move 7
bind = $mainMod SHIFT, 8, exec, $nativeMenu workspace-output move 8
bind = $mainMod SHIFT, 9, exec, $nativeMenu workspace-output move 9

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, exec, $workspaceTriad cycle next
bind = $mainMod, mouse_up, exec, $workspaceTriad cycle previous

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/anto426/audio_feedback.sh volume-up
bindel = ,XF86AudioLowerVolume, exec, ~/.config/anto426/audio_feedback.sh volume-down
bindel = ,XF86AudioMute, exec, ~/.config/anto426/audio_feedback.sh mute
bindel = ,XF86AudioMicMute, exec, ~/.config/anto426/audio_feedback.sh mic-mute
bindel = ,XF86MonBrightnessUp, exec, $nativeMenu brightness-up
bindel = ,XF86MonBrightnessDown, exec, $nativeMenu brightness-down
bindl = , XF86PowerOff, exec, $nativeMenu power
bindl = , switch:on:Lid Switch, exec, systemctl suspend

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
