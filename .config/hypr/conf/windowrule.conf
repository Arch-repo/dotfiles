#  ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝  ╚═════╝  ╚══╝╚══╝ ╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚══════╝
#------------------------------------------------------------------------------------



# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Disable blur for floating XWayland window
windowrule = no_blur on, match:xwayland true, match:float true

# Keep Ghostty translucent so Hyprland can blur the wallpaper behind it.
windowrule = opacity 0.88 0.82, match:class ghostty
windowrule = opacity 0.88 0.82, match:class com.mitchellh.ghostty

# File managers use translucent GTK theme surfaces; this makes the blur read
# closer to rofi/Ghostty without fading the text too much.
windowrule = opacity 0.94 0.88, match:class nemo
windowrule = opacity 0.94 0.88, match:class Nemo
windowrule = opacity 0.94 0.88, match:class thunar
windowrule = opacity 0.94 0.88, match:class Thunar
windowrule = opacity 0.94 0.88, match:class org.xfce.thunar
windowrule = opacity 0.94 0.88, match:class org.gnome.Nautilus
windowrule = opacity 0.94 0.88, match:class Nautilus

# Desktop widgets launched by ~/.config/anto426/widgets.sh
windowrule = float, match:class ^clock-widget$
windowrule = pin, match:class ^clock-widget$
windowrule = nofocus, match:class ^clock-widget$
windowrule = noborder, match:class ^clock-widget$
windowrule = opacity 0.86 0.78, match:class ^clock-widget$
windowrule = size 360 170, match:class ^clock-widget$
windowrule = move 40 86, match:class ^clock-widget$

windowrule = float, match:class ^cava-widget$
windowrule = pin, match:class ^cava-widget$
windowrule = nofocus, match:class ^cava-widget$
windowrule = noborder, match:class ^cava-widget$
windowrule = opacity 0.82 0.72, match:class ^cava-widget$
windowrule = size 520 180, match:class ^cava-widget$
windowrule = move 40 286, match:class ^cava-widget$

windowrule = float, match:class ^system-widget$
windowrule = pin, match:class ^system-widget$
windowrule = nofocus, match:class ^system-widget$
windowrule = noborder, match:class ^system-widget$
windowrule = opacity 0.86 0.78, match:class ^system-widget$
windowrule = size 390 230, match:class ^system-widget$
windowrule = move 40 490, match:class ^system-widget$

# Smart floating defaults for transient and utility windows.
windowrule = float, match:title ^(Open|Save|Select|Choose|File Upload|Confirm|Confirmation|Preferences|Settings|Properties|About)(.*)$
windowrule = center, match:title ^(Open|Save|Select|Choose|File Upload|Confirm|Confirmation|Preferences|Settings|Properties|About)(.*)$
windowrule = size 900 620, match:title ^(Open|Save|Select|Choose|File Upload)(.*)$
windowrule = float, match:title ^(Picture-in-Picture|Picture in picture)(.*)$
windowrule = pin, match:title ^(Picture-in-Picture|Picture in picture)(.*)$
windowrule = float, match:class ^(pavucontrol|Pavucontrol|blueman-manager|Blueman-manager|nm-connection-editor|Nm-connection-editor)$
windowrule = center, match:class ^(pavucontrol|Pavucontrol|blueman-manager|Blueman-manager|nm-connection-editor|Nm-connection-editor)$
windowrule = size 920 620, match:class ^(pavucontrol|Pavucontrol|blueman-manager|Blueman-manager|nm-connection-editor|Nm-connection-editor)$
windowrule = float, match:class ^(gnome-calculator|org.gnome.Calculator|qalculate-gtk|Galculator)$
windowrule = center, match:class ^(gnome-calculator|org.gnome.Calculator|qalculate-gtk|Galculator)$
windowrule = size 520 640, match:class ^(gnome-calculator|org.gnome.Calculator|qalculate-gtk|Galculator)$
windowrule = float, match:class ^(org.gnome.FileRoller|file-roller|zenity|yad)$
windowrule = center, match:class ^(org.gnome.FileRoller|file-roller|zenity|yad)$
