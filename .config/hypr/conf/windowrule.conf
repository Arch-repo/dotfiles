#  ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝  ╚═════╝  ╚══╝╚══╝ ╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚══════╝
#------------------------------------------------------------------------------------



# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Disable blur for floating XWayland window
windowrule = no_blur on, match:xwayland true, match:float true

# Keep Ghostty translucent so Hyprland can blur the wallpaper behind it.
windowrule = opacity 0.88 0.82 0.88, match:class ghostty
windowrule = opacity 0.88 0.82 0.88, match:class com.mitchellh.ghostty

# VSCode uses the Anto426 Rofi Dynamic theme with alpha surfaces. These rules
# let Hyprland blur the wallpaper behind the editor, close to the rofi feel.
windowrule = opacity 0.90 0.82 0.90, match:class ^(Code|code|code-url-handler|code-oss|Code - OSS|codium|Codium|VSCodium|code-insiders|Code - Insiders)$
windowrule = rounding 10, match:class ^(Code|code|code-url-handler|code-oss|Code - OSS|codium|Codium|VSCodium|code-insiders|Code - Insiders)$

# File managers use translucent GTK theme surfaces; this makes the blur read
# closer to rofi/Ghostty without fading the text too much.
windowrule = opacity 0.94 0.88 0.94, match:class nemo
windowrule = opacity 0.94 0.88 0.94, match:class Nemo
windowrule = opacity 0.94 0.88 0.94, match:class thunar
windowrule = opacity 0.94 0.88 0.94, match:class Thunar
windowrule = opacity 0.94 0.88 0.94, match:class org.xfce.thunar
windowrule = opacity 0.94 0.88 0.94, match:class org.gnome.Nautilus
windowrule = opacity 0.94 0.88 0.94, match:class Nautilus

# Desktop widgets (~/.config/anto426/widgets.sh)
windowrule = float on, match:class ^anto426.widget.clock$
windowrule = float on, match:title ^Clock Widget$
windowrule = border_size 1, match:class ^anto426.widget.clock$
windowrule = no_shadow on, match:class ^anto426.widget.clock$
windowrule = no_anim on, match:class ^anto426.widget.clock$
windowrule = no_initial_focus on, match:class ^anto426.widget.clock$
windowrule = no_follow_mouse on, match:class ^anto426.widget.clock$
windowrule = focus_on_activate off, match:class ^anto426.widget.clock$
windowrule = rounding 14, match:class ^anto426.widget.clock$
windowrule = opacity 0.90 0.82, match:class ^anto426.widget.clock$

windowrule = float on, match:class ^anto426.widget.cava$
windowrule = float on, match:title ^Cava Widget$
windowrule = border_size 1, match:class ^anto426.widget.cava$
windowrule = no_shadow on, match:class ^anto426.widget.cava$
windowrule = no_anim on, match:class ^anto426.widget.cava$
windowrule = no_initial_focus on, match:class ^anto426.widget.cava$
windowrule = no_follow_mouse on, match:class ^anto426.widget.cava$
windowrule = focus_on_activate off, match:class ^anto426.widget.cava$
windowrule = rounding 14, match:class ^anto426.widget.cava$
windowrule = opacity 0.88 0.80, match:class ^anto426.widget.cava$

windowrule = float on, match:class ^anto426.widget.system$
windowrule = float on, match:title ^System Widget$
windowrule = border_size 1, match:class ^anto426.widget.system$
windowrule = no_shadow on, match:class ^anto426.widget.system$
windowrule = no_anim on, match:class ^anto426.widget.system$
windowrule = no_initial_focus on, match:class ^anto426.widget.system$
windowrule = no_follow_mouse on, match:class ^anto426.widget.system$
windowrule = focus_on_activate off, match:class ^anto426.widget.system$
windowrule = rounding 14, match:class ^anto426.widget.system$
windowrule = opacity 0.90 0.82, match:class ^anto426.widget.system$

# Compatibilità con vecchie classi widget
windowrule = float on, match:class ^clock-widget$
windowrule = float on, match:class ^cava-widget$
windowrule = float on, match:class ^system-widget$

# Widget personalizzati (generato da widgets.sh -> arrange)
source = ~/.config/hypr/conf/widget-apps.generated.conf

# Stato blocco widget (generato da widgets.sh lock/unlock)
source = ~/.config/hypr/conf/widget-lock.generated.conf

# OSD volume/luminosità (GTK + CSS, centro schermo)
windowrule = float on, match:class ^anto426-osd$
windowrule = pin on, match:class ^anto426-osd$
windowrule = border_size 0, match:class ^anto426-osd$
windowrule = no_shadow on, match:class ^anto426-osd$
windowrule = no_anim on, match:class ^anto426-osd$
windowrule = opacity 1.00 1.00, match:class ^anto426-osd$
windowrule = center on, match:class ^anto426-osd$
windowrule = no_initial_focus on, match:class ^anto426-osd$
windowrule = no_focus on, match:class ^anto426-osd$
windowrule = focus_on_activate off, match:class ^anto426-osd$

# Smart floating defaults for transient and utility windows.
windowrule = float on, match:title ^(Open|Save|Select|Choose|File Upload|Confirm|Confirmation|Preferences|Settings|Properties|About)(.*)$
windowrule = center on, match:title ^(Open|Save|Select|Choose|File Upload|Confirm|Confirmation|Preferences|Settings|Properties|About)(.*)$
windowrule = size 900 620, match:title ^(Open|Save|Select|Choose|File Upload)(.*)$
windowrule = float on, match:title ^(Picture-in-Picture|Picture in picture)(.*)$
windowrule = pin on, match:title ^(Picture-in-Picture|Picture in picture)(.*)$
windowrule = float on, match:class ^(pavucontrol|Pavucontrol|blueman-manager|Blueman-manager|nm-connection-editor|Nm-connection-editor)$
windowrule = center on, match:class ^(pavucontrol|Pavucontrol|blueman-manager|Blueman-manager|nm-connection-editor|Nm-connection-editor)$
windowrule = size 920 620, match:class ^(pavucontrol|Pavucontrol|blueman-manager|Blueman-manager|nm-connection-editor|Nm-connection-editor)$
windowrule = float on, match:class ^(gnome-calculator|org.gnome.Calculator|qalculate-gtk|Galculator)$
windowrule = center on, match:class ^(gnome-calculator|org.gnome.Calculator|qalculate-gtk|Galculator)$
windowrule = size 520 640, match:class ^(gnome-calculator|org.gnome.Calculator|qalculate-gtk|Galculator)$
windowrule = float on, match:class ^(org.gnome.FileRoller|file-roller|zenity|yad)$
windowrule = center on, match:class ^(org.gnome.FileRoller|file-roller|zenity|yad)$
