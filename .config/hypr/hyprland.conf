# -------------------------------------------------------------------



################
### MONITORS ###
################
# Machine-local output geometry is managed atomically outside the dotfiles.
source = ~/.config/anto426-local/hypr/monitors.conf


###################
### MY PROGRAMS ###
###################
source = ~/.config/hypr/conf/programs.conf


#################
### AUTOSTART ###
#################
source = ~/.config/hypr/conf/autostart.conf


#############################
### ENVIRONMENT VARIABLES ###
#############################
source = ~/.config/hypr/conf/environment.conf


#####################
### LOOK AND FEEL ###
#####################
source = ~/.config/hypr/conf/appearance.conf
source = ~/.config/anto426-local/hypr/glass-loader.conf
source = ~/.config/hypr/conf/glass.conf
source = ~/.config/hypr/conf/animation.conf
source = ~/.config/hypr/conf/layout.conf
source = ~/.config/hypr/conf/misc.conf


#############
### INPUT ###
#############
source = ~/.config/hypr/conf/input.conf


###################
### KEYBINDINGS ###
###################
source = ~/.config/hypr/conf/keybinding.conf


####################
### WINDOWS RULE ###
####################
source = ~/.config/hypr/conf/windowrule.conf


#######################
### WORKSPACES RULE ###
#######################
# Per-output workspace groups are generated from the connected monitors.
source = ~/.config/anto426-local/hypr/workspaces.conf
